# ============================================================
#  AI秘書 設定ファイル
#  ${ENV_NAME} と書くと環境変数（GitHub Secrets）から読み込みます。
#  秘密情報（URL・トークン・APIキー）は必ず環境変数側に置いてください。
# ============================================================

# 生活のベース設定
profile:
  timezone: Asia/Tokyo
  name: ""                 # 呼びかけ名（空なら省略）
  tone: "丁寧で簡潔な、有能な秘書"
  work_hours: ["09:00", "18:00"]   # 空き時間の計算に使う

# ---------- スケジュール ----------
calendar:
  # Googleカレンダー →「設定と共有」→「カレンダーの非公開URL(iCal形式)」を貼る
  # Outlook / iCloud の公開ICS URLでもOK。複数指定できます。
  ics_urls:
    - "${CALENDAR_ICS_URL}"
  # 予定と予定のあいだが何分以上あいていたら「空き時間」と呼ぶか
  free_slot_min_minutes: 45

# ---------- タスク ----------
tasks:
  file: data/tasks.yaml
  # 期限が何日先まで来たら「もうすぐ」として出すか
  upcoming_days: 3

# ---------- お金 ----------
money:
  currency: "円"
  expenses_file: data/expenses.csv

  # 月の使えるお金（変動費の予算）
  monthly_budget: 120000

  # カテゴリ別の予算（任意・未設定のカテゴリは全体予算だけで見ます）
  category_budgets:
    食費: 45000
    日用品: 10000
    交際費: 20000
    交通費: 12000
    趣味: 15000

  # 固定費・引き落とし予定（毎月 day 日に落ちるもの）
  fixed_costs:
    - {name: "家賃",         amount: 82000, day: 27}
    - {name: "電気",         amount:  7000, day: 5}
    - {name: "ガス・水道",   amount:  6000, day: 5}
    - {name: "携帯・ネット", amount:  9000, day: 10}
    - {name: "サブスク各種", amount:  3500, day: 15}
  # 引き落とし何日前から通知するか
  remind_days_before: 3

# ---------- 通知 ----------
# 使うものだけ enabled: true にしてください（複数同時OK）
notify:
  console:
    enabled: true          # 手元での確認用。標準出力に出すだけ
  line:
    enabled: false
    channel_access_token: "${LINE_CHANNEL_ACCESS_TOKEN}"
    to: "${LINE_USER_ID}"  # 自分のユーザーID。空ならブロードキャスト
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
  discord:
    enabled: false
    webhook_url: "${DISCORD_WEBHOOK_URL}"
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"   # Gmailは「アプリパスワード」
    from_addr: "${SMTP_USERNAME}"
    to_addrs: ["${NOTIFY_EMAIL}"]

# ---------- メール自動返信（Gmail） ----------
# 件名に特定の言葉を含むメールに、決まった文面で返信します。手順: docs/gmail-autoreply.md
# まず python -m secretary autoreply --dry-run で「誰に・何を返すか」を確認してから enabled: true に。
autoreply:
  enabled: false
  username: "${SMTP_USERNAME}"     # Gmailアドレス
  password: "${SMTP_PASSWORD}"     # Gmailの「アプリパスワード」（通知メールと同じでOK）
  from_name: ""                    # 差出人として表示する名前（空ならアドレスのみ）
  mode: send                       # send = すぐ送る / draft = 下書きに入れるだけ（自分で確認して送る）
  lookback_days: 1                 # 何日前までに届いたメールを対象にするか
  max_per_run: 10                  # 1回の実行で返信する上限（暴走よけ）
  done_label: auto-replied         # 返信済みのメールに付けるGmailのラベル（半角英数字）
  rules:
    # 上から順に見て、最初に合ったルールで返信します
    - name: お問い合わせ
      subject_contains: ["お問い合わせ"]   # どれか1つを含めば対象（全角/半角・大小文字は区別しない）
      # subject_regex: "^【申込】"          # 正規表現で指定したいとき
      # subject: "お問い合わせありがとうございます"  # 返信の件名（省略すると「Re: 元の件名」）
      body: |
        {name} 様

        お問い合わせいただきありがとうございます。
        内容を確認のうえ、2営業日以内にご連絡いたします。

        ※このメールは自動送信しています。
      # 差し込める項目: {name} 相手の名前 / {email} 相手のアドレス / {subject} 元の件名 / {date} 受信日時

# ---------- 案件メールへの応募（Gmail + Googleフォーム） ----------
# 案件メールを読み、条件に合えば「▼応募はこちら」のフォームに経歴をもとに回答します。手順: docs/job-apply.md
# プロフィールと応募条件は個人情報なので、ここには書かず GitHub Secrets（JOB_PROFILE / JOB_CRITERIA）に入れます。
job_apply:
  enabled: false
  username: "${SMTP_USERNAME}"
  password: "${SMTP_PASSWORD}"
  from_contains: ["ココナラアシスト"]   # 差出人の名前かアドレスにこれを含むメールだけ見る
  from_addresses: ["assist_customer@coconala.com"]  # 差出人アドレス（from_contains より優先・なりすまし対策）
  link_marker: "▼応募はこちら"         # この後ろの最初のGoogleフォームのリンクを使う
  auto_submit: false                  # true = 自動で送信 / false = 回答入りのフォームURLを通知（押すだけ）
  profile: "${JOB_PROFILE}"           # 経歴（Secrets）。手元では profile_file でも可
  profile_file: data/profile.local.md
  criteria: "${JOB_CRITERIA}"         # 応募する条件（Secrets）。手元では criteria_file でも可
  criteria_file: data/criteria.local.md
  applicant_email: ""                 # フォームのメール欄に入れるアドレス（空なら username）
  lookback_days: 2
  max_per_run: 5
  done_label: job-checked             # 判定済みのメールに付けるGmailのラベル
  model: claude-opus-5-5
  effort: medium

# ---------- AI（文章生成） ----------
ai:
  enabled: true
  model: claude-opus-5
  effort: low              # low / medium / high — 毎朝の要約なら low で十分
  # APIキーが無い / 失敗した場合は自動でテンプレート出力にフォールバックします
